name: Guards

# Our own tools, run against this repo. If they are worth shipping they are worth
# depending on ourselves — a guard that never runs on our code is untested.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Our own tool. Locks the runner image's tool versions and diffs them when
      # GitHub bumps the image — including when a floating label like
      # ubuntu-latest silently re-points. Report-only; no fail-on yet.
      - name: Runner image drift
        uses: Booyaka101/runner-drift@v1
        with:
          fail-on-retirement: 60

      - name: pnpm v11 CI guard
        uses: Booyaka101/pnpm11-ci-guard@v1
        with:
          mode: warn

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install-script audit
        run: npx --yes npm-script-lens@latest audit --path .
      # Version cooldown: npm worms are typically identified within hours, so
      # refuse to be among the first to install a brand-new version.
      - name: Dependency cooldown
        # report-only until 2026-08-12; then this line goes and it becomes a gate
        continue-on-error: true
        run: npx --yes npm-script-lens@latest audit --path . --cooldown

      # Drift gate: fails if a dependency gains an install script that nobody has
      # approved. The allowlist is only worth having if it is enforced — this
      # step carried `continue-on-error: true`, which made it a report, not a
      # gate, despite the name. Pinned rather than @latest for the same reason
      # as the manifest step below: a gate that can fail must fail only on OUR
      # changes, never on a detector release landing mid-week.
      - name: Allowlist drift
        run: npx --yes npm-script-lens@1.4.0 sync --path . --check

      # The allowlist records *which* packages may run scripts. This records
      # what those scripts DO — so a package we already approved cannot quietly
      # change its install-time behavior under the same version. That is the
      # supply-chain shape an allowlist alone cannot see.
      #
      # Pinned, not @latest: the manifest carries the tool version that produced
      # it, so a detector upgrade is itself drift. Bumping this pin is the
      # deliberate moment to re-run `manifest --write` and read the diff.
      - name: Install-behavior drift
        run: npx --yes npm-script-lens@1.4.0 manifest --path . --check --no-trust
